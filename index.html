.sorry {
    font-family: "Times New Roman", Times, serif;
    font-size: 48px;
    opacity: 0;
    transform: scale(0.1);
    animation: appear 2.5s ease-out forwards;
}

@keyframes appear {
    0% {
        opacity: 0;
        transform: scale(0.1);
    }

    70% {
        opacity: 1;
        transform: scale(1.2);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}
