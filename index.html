<!DOCTYPE html>
<html>
<head>
    <title>I Am Sorry</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            overflow: hidden;
        }

        .sorry {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            opacity: 0;
            transform: scale(0.5);
            animation: appear 2s ease-out forwards;
        }

        @keyframes appear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            60% {
                opacity: 1;
                transform: scale(1.15);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="sorry">I am sorry</div>
</body>
</html>
